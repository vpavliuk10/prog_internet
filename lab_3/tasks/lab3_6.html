<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 6</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
        }
        .section { 
            margin-bottom: 20px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            width: 300px; 
            background: #f9f9f9;
        }
        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h3>Завдання 6. Варіант 2</h3>

    <div class="section">
        <p id="info">Початковий текст абзацу</p>
    </div>

    <div class="section">
        <img id="main-img" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500" alt="Фото 1">
    </div>

    <div class="section">
        <button id="action-btn">Кнопка дії</button>
    </div>

    <script>
        const infoParagraph = document.getElementById('info');
        
        let initialText = infoParagraph.textContent;
        console.log("Початковий текст:", initialText);

        infoParagraph.textContent = "Новий оновлений текст";


        setTimeout(() => {
            const mainImg = document.getElementById('main-img');
            mainImg.src = "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500";
        }, 2000);


        const actionBtn = document.getElementById('action-btn');
        
        actionBtn.style.color = 'red';
        actionBtn.style.backgroundColor = 'yellow';
        actionBtn.style.padding = '8px 15px';
        actionBtn.style.cursor = 'pointer';
    </script>

</body>
</html>
