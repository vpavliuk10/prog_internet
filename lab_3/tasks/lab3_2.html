<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
        }
        .calculator { 
            width: 240px; 
            background: #f0f0f0; 
            padding: 15px; 
            border: 1px solid #ccc; 
        }
        .display { 
            background: #fff; 
            padding: 10px; 
            font-size: 24px; 
            text-align: right; 
            margin-bottom: 10px; 
            border: 1px solid #999; 
        }
        .buttons { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 5px; 
        }
        button { 
            padding: 10px; 
            font-size: 16px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h3>Завдання 2. Простий калькулятор</h3>

    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>→</button>
            <button style="background: #e74c3c; color: white;">C</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>×</button>
            <button>÷</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            <button style="background: #2980b9; color: white;">=</button>

            <button>+/-</button>
            <button>0</button>
            <button>.</button>
            <button>+</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('button');

        let currentInput = '0';

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;

                if (value === 'C') {
                    currentInput = '0';
                } else if (value === '→') { 
                    currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
                } else if (value === '=') {
                    try {
                        let expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                        let result = eval(expression);

                        if (!isFinite(result)) {
                            currentInput = 'Помилка';
                        } else {
                            currentInput = result.toString();
                        }
                    } catch (error) {
                        currentInput = 'Помилка';
                    }
                } else if (value === '+/-') {
                    if (currentInput.startsWith('-')) {
                        currentInput = currentInput.slice(1);
                    } else if (currentInput !== '0') {
                        currentInput = '-' + currentInput;
                    }
                } else {
                    if (currentInput === '0' && value !== '.') {
                        currentInput = value;
                    } else {
                        currentInput += value;
                    }
                }

                display.textContent = currentInput;
            });
        });
    </script>

</body>
</html>
