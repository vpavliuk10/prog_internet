<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №7</title>
</head>
<body>
    <h1>Лабораторна робота №7. Робота з об'єктами, Date та класами</h1>

    <section>
        <h3>Завдання 1: Час і додавання секунд</h3>
        <p>Поточний час: <span id="current-time"></span></p>
        <input type="number" id="seconds-input" placeholder="Кількість секунд для додавання">
        <br>
        <button onclick="runTask1()">Змінити час</button>
        <div class="result" id="task1-result"></div>
    </section>

    <section>
        <h3>Завдання 2.1. Виведення поточної дати, дня тижня і часу</h3>
        <button onclick="runTask2_1()">Вивести дату і час</button>
        <div class="result" id="task2-1-result"></div>

        <h3>Завдання 2.2. Останній день місяця</h3>
        <input type="number" id="month-input" placeholder="Місяць (1-12)">
        <input type="number" id="year-input" placeholder="Рік">
        <br>
        <button onclick="runTask2_2()">Знайти останній день місяця</button>
        <div class="result" id="task2-2-result"></div>

        <h3>Завдання 2.3. Секунди від початку доби та до кінця доби</h3>
        <button onclick="runTask2_3()">Вивести секунди</button>
        <div class="result" id="task2-3-result"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
