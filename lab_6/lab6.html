<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 6</title>
</head>
<body>
    <h1>Лабораторна робота 6 - завдання 1-6.</h1>

    <div class="task-box">
        <h3>Завдання 1. Довжина рядка</h3>
        <input type="text" id="task1-input" placeholder="Введіть рядок">
        <button onclick="task1()">Виконати</button>
        <p> Результат: <span id="task1-result"></span></p>
    </div>

    <div class="task-box">
        <h3>Завдання 2. Регістри</h3>
        <input type="text" id="task2-input" placeholder="Введіть рядок">
        <button onclick="task2()">Виконати</button>
        <p> Результат: <span id="task2-result"></span></p>
    </div>

    <div class="task-box">
        <h3>Завдання 3. Індекс першого входження символу</h3>
        <input type="text" id="task3-input" placeholder="Введіть рядок">
        <input type="text" id="task3-char" placeholder="Введіть символ">
        <button onclick="task3()">Виконати</button>
        <p> Результат: <span id="task3-result"></span></p>
    </div>

    <div class="task-box">
        <h3>Завдання 4. Кількість входжень символу</h3>
        <input type="text" id="task4-input" placeholder="Введіть рядок">
        <input type="text" id="task4-char" placeholder="Введіть символ">
        <button onclick="task4()">Виконати</button>
        <p> Результат: <span id="task4-result"></span></p>

    <div class="task-box">
        <h3>Завдання 5. Змінити місцями кожні два сусідні символи</h3>
        <input type="text" id="task5-input" placeholder="Введіть рядок">
        <button onclick="task5()">Виконати</button>
        <p> Результат: <span id="task5-result"></span></p>
    </div>    

</body>
<script src="script/script.js"></script>
</html>
