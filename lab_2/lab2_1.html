<html>
<head>
<meta charset="utf-8">
<title>Завдання 1</title>
</head>
<body onLoad="clock()">
    <h3> Завдання 1. Годинник та дата (Варіант 2)</h3>
<form name="clock">
Повний формат:<br>
<input type="text" name="datetime" size="25" value="">
</form>
<script Language="JavaScript">
let dateTimeStr;
function clock() {
    let now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    let date = now.getDate();
    let month = now.getMonth() + 1;
    let year = now.getFullYear(); 

    hours = (hours < 10) ? "0" + hours : hours;
    minutes = (minutes < 10) ? "0" + minutes : minutes;
    seconds = (seconds < 10) ? "0" + seconds : seconds;
    month = (month < 10) ? "0" + month : month;
    date = (date < 10) ? "0" + date : date;

    dateTimeStr = year + ":" + month + ":" + date + ":" + hours + ":" + minutes + ":" + seconds;

    document.clock.datetime.value = dateTimeStr;

    let Timer = setTimeout("clock()", 1000);
}
</script>
</body>
</html>
