<html>
<head>
<meta charset="utf-8">
<title>Завдання 4-7 - Консоль</title>
<script>
function runConsoleTasks() {
    console.clear();
    console.log("=== ЗАВДАННЯ 4 ===");
    let a = 15, b = 4;
    let remainder = a % b;
    console.log("Остача від ділення %d на %d дорівнює: %d", a, b, remainder);
    console.log("Чи дорівнює остача нулю? ->", remainder === 0);

    let arr = [10, 20, 30];
    console.log("Значення масиву: %d, %d, %d", arr[0], arr[1], arr[2]);
    console.log("Перший елемент масиву як рядок: %s", arr[0]);


    console.log("\n=== ЗАВДАННЯ 5 ===");
    console.info("Це інформаційне повідомлення (console.info)");
    console.warn("Це попередження (console.warn)");
    console.error("Це повідомлення про помилку (console.error)");
    
    let user = {name: "Vasyl", role: "Student"};
    console.dir(user);

    console.time("Час виконання циклу");
    let dummySum = 0;
    for(let i = 0; i < 1000000; i++) { dummySum += i; }
    console.timeEnd("Час виконання циклу");

    console.assert(10 > 20, "Помилка: 10 не може бути більше за 20 ");


    console.log("\n=== ЗАВДАННЯ 6 та 7 ===");
    let names = ["Yulia", "Bohdan", "Vlad", "Taya", "Arsen", "Vika"];
    let vowels = ['A', 'E', 'I', 'O', 'U', 'Y'];

    let totalAscii = 0;
    for(let name of names) {
        for(let i = 0; i < name.length; i++) {
            totalAscii += name.charCodeAt(i);
        }
    }
    let asciiThreshold = totalAscii / names.length;
    console.log("Анотація Завдання 7: " + asciiThreshold.toFixed(2));

    for(let name of names) {
        let firstLetter = name[0].toUpperCase();
        let greeting = "";

        if(vowels.includes(firstLetter)) {
            greeting = "Goodbye " + name;
        } else {
            greeting = "Hello " + name;
        }

        let nameAscii = 0;
        for(let i = 0; i < name.length; i++) {
            nameAscii += name.charCodeAt(i);
        }

        if(nameAscii > asciiThreshold) {
            greeting += " [VIP статус за ASCII]";
        } else {
            greeting += " [Стандартний статус]";
        }

        console.log(greeting);
    }
}
</script>
</head>
<body>
    <h3>Завдання 4–7. Дослідження методів console</h3>
    <p>Натисніть кнопку нижче, а потім відкрийте консоль браузера (F12 -> вкладка Console), щоб побачити результати.</p>
    <button onClick="runConsoleTasks()">Виконати завдання в консолі</button>
</body>
</html>
