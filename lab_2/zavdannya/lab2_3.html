<html>
<head>
<meta charset="utf-8">
<script>
let str, stb;
function fun()
{
str = parseInt(main_form.t_str.value);
stb = parseInt(main_form.t_stb.value);
let res_str = "<table>\n";
for(let i=1; i<=str; i++)
{
res_str+="<tr>\n";
for(let j=1; j<=stb; j++)
{
let val = (3 * i) + j;
res_str += "<td>";
res_str += "<input type = \"text\" id = \"_" + i + "_" + j + "\" value = \"" + val + "\">";
res_str += "<\/td>\n";
}
res_str+="<\/tr>\n";
}
res_str += "<\/table>";
main_div.innerHTML = res_str;
}

function fun_build()
{
let sum = 0;
let targetRow = 2; 

if (targetRow > str) {
    alert("У матриці немає другого рядка!");
    return;
}

for(let j=1; j<=stb; j++)
{
    let res_str = "sum += parseInt(main_form._" + targetRow + "_" + j + ".value);";
    eval(res_str);
}
alert("Сума 2-го рядка = " + sum);
}
</script>
</head>
<body>
<form id = "main_form">
<table>
<tr>
<td>Кількість строк</td>
<td> <input type="text" id = "t_str" value="3"></td>
</tr>
<tr>
<td> Кількість стовбців</td>
<td><input type="text" id = "t_stb" value="3"></td>
</tr>
<tr>
<td> <input type = "button" onClick = "fun();" value = "Побудувати матрицю"></td>
</tr>
<tr>
<td> <input type = "button" onClick = "fun_build();" value = "Розрахувати"></td>
</tr>
</table>
<div id = "main_div"></div>
</form>
</body>
</html>
